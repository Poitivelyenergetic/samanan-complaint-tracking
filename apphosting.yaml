# Firebase App Hosting environment configuration.
# See https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 0

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
  # A DSN is a write-only ingest endpoint, not a secret — safe as a plain
  # value rather than a Secret Manager entry (it's exposed to the browser
  # bundle either way).
  - variable: NEXT_PUBLIC_SENTRY_DSN
    value: https://cd79f90fcea6d0a609eee6ec6d807da5@o4512108797886464.ingest.us.sentry.io/4512108918407168
    availability:
      - BUILD
      - RUNTIME

# No FIREBASE_PROJECT_ID/CLIENT_EMAIL/PRIVATE_KEY here — that prefix is
# reserved by App Hosting and can't be set via this file. The Admin SDK
# (src/lib/firebaseAdmin.ts) falls back to Application Default Credentials
# from this backend's attached service account when those vars are absent,
# which is what happens here.
