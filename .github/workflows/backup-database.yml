name: Daily database backup

on:
  schedule:
    # 30 minutes after the code mirror (backup.yml), both UTC.
    - cron: "30 1 * * *"
  workflow_dispatch: {}

jobs:
  export-firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Export Firestore to Cloud Storage
        run: |
          gcloud firestore export \
            "gs://samnan-complaint-tracking.firebasestorage.app/firestore-backups/$(date -u +%Y-%m-%dT%H-%M-%SZ)" \
            --project=samnan-complaint-tracking
