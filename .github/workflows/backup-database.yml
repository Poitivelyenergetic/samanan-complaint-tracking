name: Daily database backup

on:
  schedule:
    # 30 minutes after the code mirror (backup.yml), both UTC.
    - cron: "30 1 * * *"
  workflow_dispatch: {}

jobs:
  backup-firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # See backup.yml's comment on this same option — actions/checkout
          # would otherwise install its own scoped GITHUB_TOKEN as a
          # credential override for github.com, silently superseding
          # BACKUP_PUSH_TOKEN below when we push to a different repo.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install firebase-admin --no-save

      - name: Dump Firestore to JSON
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: node scripts/backup-firestore.mjs "$RUNNER_TEMP/firestore-dump"

      - name: Push dump to backup repo
        env:
          BACKUP_PUSH_TOKEN: ${{ secrets.BACKUP_PUSH_TOKEN }}
        run: |
          STAMP=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          git clone "https://${BACKUP_PUSH_TOKEN}@github.com/Poitivelyenergetic/samnan-complaint-tracking-backup.git" "$RUNNER_TEMP/backup-repo"
          mkdir -p "$RUNNER_TEMP/backup-repo/firestore-backups/$STAMP"
          cp "$RUNNER_TEMP"/firestore-dump/*.json "$RUNNER_TEMP/backup-repo/firestore-backups/$STAMP/"
          cd "$RUNNER_TEMP/backup-repo"
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Firestore backup $STAMP" || echo "Nothing to commit"
          git push
