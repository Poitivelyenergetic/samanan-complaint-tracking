name: Daily database backup

on:
  schedule:
    # 30 minutes after the code mirror (backup.yml), both UTC.
    - cron: "30 1 * * *"
  workflow_dispatch: {}

jobs:
  backup-firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set backup timestamp
        run: echo "STAMP=$(date -u +%Y-%m-%dT%H-%M-%SZ)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up backup tool
        # Installed in its own throwaway folder, isolated from the app's
        # own package.json/lockfile — installing firebase-admin directly
        # into the checked-out repo left @google-cloud/firestore (one of
        # its own dependencies) missing, apparently due to npm reconciling
        # against the app's unrelated lockfile even with --no-save.
        run: |
          mkdir -p "$RUNNER_TEMP/backup-tool"
          cp scripts/backup-firestore.mjs "$RUNNER_TEMP/backup-tool/"
          cd "$RUNNER_TEMP/backup-tool"
          npm install firebase-admin

      - name: Dump Firestore to JSON
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        working-directory: ${{ runner.temp }}/backup-tool
        run: node backup-firestore.mjs "$RUNNER_TEMP/firestore-dump"

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Push dump to Cloud Storage (Google)
        # Plain file uploads, not gcloud firestore export — so, unlike the
        # approach this replaced, there's no requirement for the bucket to
        # be in the same region as Firestore itself. Uses the app's own
        # existing bucket (already used for complaint attachments), so no
        # new bucket or extra IAM grant is needed.
        run: |
          gcloud storage cp "$RUNNER_TEMP"/firestore-dump/*.json \
            "gs://samnan-complaint-tracking.firebasestorage.app/firestore-backups/$STAMP/" \
            --project=samnan-complaint-tracking
